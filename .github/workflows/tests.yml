name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Core and tools
        run: cargo test --locked -p deck-core -p deck-tools --no-fail-fast
      - name: Window
        run: cargo test --locked -p rustutty --features test-hooks
