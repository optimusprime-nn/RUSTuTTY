name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core and tools
        run: cargo test --locked -p deck-core -p deck-tools --no-fail-fast
      - name: Window
        run: cargo test --locked -p rustutty --features test-hooks
