# A tag such as v1.0.0 tests, builds and publishes a release. A version with a
# hyphen, such as v1.0.0-beta.1, is marked as a pre-release. Running this by hand
# does everything but publish, and leaves the files on the run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DECK_EXE: ${{ github.workspace }}\target\release\rustutty.exe
      DECK_TOOLS: ${{ github.workspace }}\target\release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Find the version
        id: version
        shell: pwsh
        run: |
          $version = (cargo pkgid -p rustutty) -replace '.*[@#]', ''
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Core and tools
        run: cargo test --locked -p deck-core -p deck-tools --no-fail-fast
      - name: Window
        run: cargo test --locked -p rustutty --features test-hooks
      - name: Add third-party licences
        run: python scripts/notices.py
      - name: Build the programs
        run: cargo build --locked --release -p rustutty -p deck-tools
      - name: Build the installer
        run: cargo build --locked --release -p deck-setup
      - name: Package
        shell: pwsh
        run: |
          $name = "RUSTuTTY-${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory out, $name | Out-Null
          foreach ($file in 'rustutty', 'plink', 'pscp', 'psftp', 'puttygen', 'pageant') {
            Copy-Item "target\release\$file.exe" $name
          }
          Copy-Item LICENCE "$name\LICENCE.txt"
          Compress-Archive $name "out\$name-portable.zip"
          Copy-Item target\release\setup.exe "out\$name-setup.exe"
          Push-Location out
          Get-ChildItem | ForEach-Object { "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
      - name: Check every program has the icon
        shell: pwsh
        run: |
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Res {
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint flags);
            [DllImport("kernel32")] public static extern IntPtr FindResource(IntPtr m, IntPtr name, IntPtr type);
            [DllImport("kernel32")] public static extern bool FreeLibrary(IntPtr m);
          }
          '@
          $name = "RUSTuTTY-${{ steps.version.outputs.version }}"
          $missing = @()
          foreach ($exe in @(Get-ChildItem "$name\*.exe") + @(Get-Item "out\$name-setup.exe")) {
            # LOAD_LIBRARY_AS_DATAFILE | LOAD_LIBRARY_AS_IMAGE_RESOURCE: read it, don't run it
            $m = [Res]::LoadLibraryEx($exe.FullName, [IntPtr]::Zero, 0x22)
            if ([Res]::FindResource($m, [IntPtr]1, [IntPtr]14) -eq [IntPtr]::Zero) { $missing += $exe.Name }
            [Res]::FreeLibrary($m) | Out-Null
          }
          if ($missing) { throw "No icon in: $($missing -join ', ')" }
          "Every program has the icon"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: out
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pre = @(if ($env:GITHUB_REF_NAME.Contains('-')) { '--prerelease' })
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem out).FullName --verify-tag --generate-notes --title "RUSTuTTY $env:GITHUB_REF_NAME" @pre
