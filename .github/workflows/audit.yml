# Checks Cargo.lock against the RustSec advisory database on every change to the
# dependencies, and each day, since a new advisory can name a crate already in
# use. Advisories accepted for now are listed in .cargo/audit.toml.
name: Audit

on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  pull_request:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit@0.22.2
      - name: Check dependencies for advisories
        run: cargo audit --deny warnings --file Cargo.lock
