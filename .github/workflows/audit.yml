# Checks Cargo.lock against the RustSec advisory database on every change to the
# dependencies, and each day, since a new advisory can name a crate already in
# use. Advisories accepted for now are listed in .cargo/audit.toml.
name: Audit

on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  pull_request:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit@0.22.2
      - name: Check dependencies for advisories
        run: cargo audit --deny warnings --file Cargo.lock
      # An accepted advisory stays ignored even after a fix ships, so this fails
      # the run once one is withdrawn, or once updating the dependencies would
      # bring in its fix. A fix the crates we use don't accept yet only warns.
      - name: Check accepted advisories still have no fix we can take
        run: |
          ids=$(grep -o 'RUSTSEC-[0-9]*-[0-9]*' .cargo/audit.toml | sort -u)
          # What the newest versions our dependencies allow would still have
          cargo update --quiet
          mv .cargo/audit.toml "$RUNNER_TEMP/audit.toml"
          cargo audit --no-fetch --json --file Cargo.lock > "$RUNNER_TEMP/updated.json" || true
          mv "$RUNNER_TEMP/audit.toml" .cargo/audit.toml
          git checkout -- Cargo.lock
          fail=0
          for id in $ids; do
            file=$(find ~/.cargo/advisory-db/crates -name "$id.md" | head -1)
            if [ -z "$file" ]; then
              echo "::error::$id was withdrawn: take it out of .cargo/audit.toml"
              fail=1
            elif grep -q '^patched = \[\]' "$file"; then
              continue
            elif jq -e --arg id "$id" '[.vulnerabilities.list[].advisory.id] | index($id)' "$RUNNER_TEMP/updated.json" > /dev/null; then
              echo "::warning::$id has a fix, but the crates that use it don't accept the fixed version yet"
            else
              echo "::error::$id has a fix that cargo update brings in: update the crate and take it out of .cargo/audit.toml"
              fail=1
            fi
          done
          exit $fail
