# Checks Cargo.lock against the RustSec advisory database on every change to the
# dependencies, and each day, since a new advisory can name a crate already in
# use. Advisories accepted for now are listed in .cargo/audit.toml.
name: Audit

on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  pull_request:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit@0.22.2
      - name: Check dependencies for advisories
        run: cargo audit --deny warnings --file Cargo.lock
      # An accepted advisory stays ignored even after a fix ships, so this fails
      # the run as soon as one has a fixed version, or is withdrawn
      - name: Check accepted advisories still have no fix
        run: |
          fail=0
          for id in $(grep -o 'RUSTSEC-[0-9]*-[0-9]*' .cargo/audit.toml | sort -u); do
            file=$(find ~/.cargo/advisory-db/crates -name "$id.md" | head -1)
            if [ -z "$file" ] || ! grep -q '^patched = \[\]' "$file"; then
              echo "::error::$id now has a fix or was withdrawn: update the crate and take it out of .cargo/audit.toml"
              fail=1
            fi
          done
          exit $fail
