[package]
name = "deck-setup"
version = "1.0.0-beta.5"
edition = "2021"

[[bin]]
name = "setup"
path = "src/main.rs"

[features]
# Installs only into the folder DECK_SETUP_DIR names, with no Start menu entry
# and no registry: for trying the installer. Never shipped.
test-hooks = []

[build-dependencies]
embed-resource = "3"

[dependencies]
deck-ui = { path = "../deck-ui" }
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
