[workspace]
resolver = "2"
members = ["crates/deck-core", "crates/deck-setup", "crates/deck-tools", "crates/deck-ui", "crates/rustutty"]

[profile.release]
lto = "thin"
panic = "abort"

# RSA and key exchange are far too slow unoptimised, even in tests
[profile.dev.package."*"]
opt-level = 2

# RUSTuTTY's own copy of the terminal library, changed for what PuTTY does
# that it doesn't: blinking text, background colour erase that can be turned
# off, and wide ambiguous-width characters. See vendor/alacritty_terminal/RUSTUTTY.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
