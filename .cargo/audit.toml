# Settings for `cargo audit` and the Audit workflow.
[advisories]
ignore = [
    # The Marvin attack on the rsa crate, which russh uses. No fixed version
    # exists yet. RUSTuTTY only signs with RSA, once per login, and its Pageant
    # only answers programs running as the same user. The Audit workflow fails
    # once a fix ships: then update the crate and remove this line.
    "RUSTSEC-2023-0071",
]
